# make packages
name: scpanel
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: net
priority: optional
maintainer: GxdTxnz <GxdTxnz@users.noreply.github.com>
description: Terminal UI for scp, built for servers
homepage: https://github.com/GxdTxnz/SCP-prog

contents:
  - dst: /usr/libexec/scpanel
    type: dir
    file_info:
      mode: 0755
  - src: dist/scpanel
    dst: /usr/libexec/scpanel/scpanel
    file_info:
      mode: 0755
  - src: /usr/libexec/scpanel/scpanel
    dst: /usr/bin/scpanel
    type: symlink

overrides:
  deb:
    depends:
      - libc6 (>= 2.17)
      - ncurses-base
      - openssh-client
    recommends:
      - rsync
    suggests:
      - nano
      - less
  rpm:
    depends:
      - libc.so.6(GLIBC_2.17)(64bit)
      - /usr/share/terminfo/x/xterm
      - openssh-clients

deb:
  compression: xz
rpm:
  compression: xz
